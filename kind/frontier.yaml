# The boundary with one way out, for a model that runs outside it (ADR 14).
# Two nodes: everything runs on the first, as in kind/cluster.yaml; the
# second is the egress node, the one the host's firewall lets open TCP 443 to
# Anthropic's published API range, and nothing runs there but the gateway.
# Its taint keeps the scheduler from putting anything else on it; who may run
# there anyway is decided at admission (admission/egress-node.yaml), since a
# pod can tolerate a taint or name a node.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: air-gapped
nodes:
  - role: control-plane
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    # A one-node kind cluster schedules on its control plane; with a second
    # node it keeps the control-plane taint. The workloads stay here.
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          taints: []
  - role: worker
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    labels:
      boundary.heyvaldemar.com/egress: anthropic
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          taints:
            - {key: boundary.heyvaldemar.com/egress, value: anthropic, effect: NoSchedule}
