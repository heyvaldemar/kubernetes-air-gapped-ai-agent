# The embedding model's server (ADR 21): the same llama.cpp image as the
# chat model's, serving embeddings for the company's documents and for the
# questions asked of them. The model is mounted read-only from a signed image
# volume and admitted like the chat model, signature and AI-BOM. Only the MCP
# server reaches it (network-policies.yaml), and it reaches nothing.
# @MODEL@, @NAME@ and @ALIAS@ as in llama.yaml.
apiVersion: v1
kind: Namespace
metadata:
  name: inference
  labels:
    boundary.heyvaldemar.com/models: verified
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: @NAME@
  namespace: inference
spec:
  replicas: 1
  selector:
    matchLabels: {app: embed, server: @NAME@}
  template:
    metadata:
      labels: {app: embed, server: @NAME@}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: llama-server
          image: ghcr.io/ggml-org/llama.cpp:server-b11429@sha256:2f8ebc2dde83c4bd7e5c6d61efa57965e0d5a79d29802c246c4593740d9c04c1
          # Mean pooling is how nomic-embed-text was trained. A document is
          # embedded whole, so a batch holds the model's whole context.
          args: ["-m", "/models/model.gguf", "--alias", "@ALIAS@", "--embedding", "--pooling", "mean",
                 "-c", "2048", "-b", "2048", "-ub", "2048", "-np", "1", "-t", "1",
                 "--host", "0.0.0.0", "--port", "8080"]
          ports: [{name: http, containerPort: 8080}]
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits: {memory: 1Gi}
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            failureThreshold: 60
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: model, mountPath: /models, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: model
          image:
            reference: @MODEL@
            pullPolicy: IfNotPresent
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: @NAME@
  namespace: inference
spec:
  selector: {app: embed, server: @NAME@}
  ports: [{name: http, port: 8080, targetPort: http}]
