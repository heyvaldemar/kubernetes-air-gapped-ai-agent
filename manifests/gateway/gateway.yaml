# One way in to the model servers: agentgateway, inside the boundary.
#
# A client names the model in the request, as the OpenAI API does. Before any
# route is chosen, the gateway copies that name from the body into a header;
# each route (route.yaml, one per model server) sends one name to one server,
# and a name with no route is refused at the gateway. A caller shows who it is
# with a service account token made for the gateway's audience and signed by
# the cluster; without one it is refused with 401. The quota follows that
# identity: the support agent may send 60 requests a minute, any other
# workload 3, and a request over the quota is refused with 429 while every
# other workload is still served. Nothing here reaches outside the boundary:
# the model servers have no egress, and the gateway has nowhere to send a
# request but the Services the routes name. tests/e2e/gateway.sh proves it.
apiVersion: v1
kind: Namespace
metadata:
  name: gateway
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
# The proxy the controller starts for the Gateway runs under the namespace's
# restricted Pod Security profile; its generated Deployment sets everything
# that profile asks but the seccomp profile, which this adds.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayParameters
metadata:
  name: restricted
  namespace: gateway
spec:
  deployment:
    spec:
      template:
        spec:
          securityContext:
            seccompProfile: {type: RuntimeDefault}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: models
  namespace: gateway
spec:
  gatewayClassName: agentgateway
  infrastructure:
    parametersRef:
      group: agentgateway.dev
      kind: AgentgatewayParameters
      name: restricted
  listeners:
    - name: http
      protocol: HTTP
      port: 8080
      allowedRoutes:
        namespaces: {from: Same}
---
# The model's name, from the body into a header, before routing. The same
# expression the agentgateway documentation uses for routing by model.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: model-from-body
  namespace: gateway
spec:
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: Gateway, name: models}
  traffic:
    phase: PreRouting
    transformation:
      request:
        set:
          - name: x-gateway-model
            value: string(json(request.body).model)
---
# Who is calling, and how often they may. The token is a projected service
# account token for this audience; the issuer and the public keys are the
# cluster's own, written in by scripts/gateway.sh install from the API
# server's discovery document, so the gateway checks a token without fetching
# anything. The token stops here: the gateway removes it before the request
# goes on. The limit is keyed on the token's subject, never on a header the
# caller writes. The agent's 60 a minute is about twice its busiest minute in
# the evals (docs/decisions/0011-the-gateway-knows-who-is-calling.md).
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: per-workload
  namespace: gateway
spec:
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: Gateway, name: models}
  traffic:
    jwtAuthentication:
      mode: Strict
      providers:
        - issuer: "@ISSUER@"
          audiences: [models.boundary.heyvaldemar.com]
          jwks:
            inline: '@JWKS@'
    rateLimit:
      conditional:
        - condition: 'jwt.sub == "system:serviceaccount:agents:support-agent"'
          policy:
            local:
              - {key: jwt.sub, requests: 60, unit: Minutes}
        - policy:
            local:
              - {key: jwt.sub, requests: 3, unit: Minutes}
---
# The routes live in gateway and the Services in inference: inference says
# which namespace may point at them.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: from-gateway
  namespace: inference
spec:
  from:
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, namespace: gateway}
  to:
    - {group: "", kind: Service}
---
# The model servers answer the gateway too, still with no egress of their own.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: from-gateway
  namespace: inference
spec:
  podSelector:
    matchLabels:
      app: llama
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gateway
      ports:
        - {protocol: TCP, port: 8080}
---
# The agents reach the gateway: its listener, and the proxy's metrics.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway
  namespace: agents
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gateway
      ports:
        - {protocol: TCP, port: 8080}
        - {protocol: TCP, port: 15020}
