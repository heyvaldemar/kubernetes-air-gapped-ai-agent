# One route per model server: a request that names @MODEL@ goes to the
# model server @SERVICE@ in inference, and nowhere else. scripts/gateway.sh
# install applies one for each model it is told the cluster serves. The
# policies on the Gateway (gateway.yaml) cover every route.
#
# The route points at an AgentgatewayBackend, never at the Service itself.
# Only through a backend that says it is a model does the gateway read each
# answer's usage and count its tokens. On a route straight to the Service, a
# token budget is accepted, shows as attached, and refuses nothing (ADR 12).
# The backend sits beside the Service in inference, the one namespace it may
# name a Service in; the answer comes back as the server wrote it, timings
# included.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: "@SERVICE@"
  namespace: inference
spec:
  ai:
    provider:
      custom:
        backendRef: {name: "@SERVICE@", port: 8080}
        formats:
          - type: Completions
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: "@SERVICE@"
  namespace: gateway
spec:
  parentRefs:
    - name: models
  rules:
    - matches:
        - path: {type: PathPrefix, value: /v1/}
          headers:
            - {name: x-gateway-model, value: "@MODEL@"}
      backendRefs:
        - {group: agentgateway.dev, kind: AgentgatewayBackend, name: "@SERVICE@", namespace: inference}
---
# A model server that is gone is found out in a second, not when the cluster
# notices (ADR 20). A connection to it gives up after one second, one failed
# connection or 5xx takes it out of the rotation for thirty seconds, and the
# request is sent once more, to another one. Until the API server sees a
# lost node, about 50 s, its pods stay in their Services; without this, a
# share of the requests went to a server that no longer existed.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: "@SERVICE@-backend"
  namespace: inference
spec:
  targetRefs:
    - {group: agentgateway.dev, kind: AgentgatewayBackend, name: "@SERVICE@"}
  backend:
    tcp:
      connectTimeout: 1s
    health:
      eviction:
        consecutiveFailures: 1
        duration: 30s
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: "@SERVICE@-retry"
  namespace: gateway
spec:
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: "@SERVICE@"}
  traffic:
    retry:
      attempts: 1
      codes: [503]
