# The tool side of the boundary: the agent's namespace and identity, the
# people it works for, the MCP server, the records service it fronts, the
# report service, and the network policies between them. The model server is
# applied by scripts/serve.sh, which names the model by digest.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespaces.yaml
  - people/people.yaml
  - mcp/mcp.yaml
  - tools/gateway.yaml
  - records/records.yaml
  - network-policies.yaml
configMapGenerator:
  - name: mcp-server
    namespace: mcp
    files:
      - mcp/server.py
      - mcp/policy.json
  - name: records-api
    namespace: corp
    files:
      - records/records_api.py
  - name: mcp-documents
    namespace: mcp
    files:
      - mcp/documents/data-retention.md
      - mcp/documents/escalation-runbook.md
      - mcp/documents/holiday-coverage.md
      - mcp/documents/invoice-disputes.md
      - mcp/documents/pricing-tiers.md
      - mcp/documents/q3-margins.md
      - mcp/documents/refund-policy.md
      - mcp/documents/renewal-playbook.md
      - mcp/documents/security-incident-reporting.md
      - mcp/documents/support-sla-2024.md
      - mcp/documents/support-sla-2026.md
      - mcp/documents/travel-policy.md
      - mcp/documents/vendor-onboarding.md
generatorOptions:
  disableNameSuffixHash: true
