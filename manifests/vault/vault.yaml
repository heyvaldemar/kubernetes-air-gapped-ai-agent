# Vault Community (ADR 24): the issuer of the records credential, a JWT that
# lives a minute, for the MCP server's service account alone. Not dev mode:
# integrated storage on a volume, TLS, sealed after every start until
# scripts/vault.sh unseals it. One replica.
#
# Its service account can do one thing in the Kubernetes API: ask whether a
# caller's token is genuine (system:auth-delegator, TokenReview), which is
# how Vault's Kubernetes auth knows the MCP server. Only the MCP server
# reaches it, and it reaches only the API server (scripts/tools.sh writes
# that rule, which names the API server's address).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault
  namespace: vault
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vault-token-review
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: vault
    namespace: vault
---
apiVersion: v1
kind: Service
metadata:
  name: vault
  namespace: vault
spec:
  selector:
    app.kubernetes.io/name: vault
  ports:
    - {name: https, port: 8200, targetPort: https}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vault
  namespace: vault
  labels:
    app.kubernetes.io/name: vault
spec:
  serviceName: vault
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vault
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vault
    spec:
      serviceAccountName: vault
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vault
          image: docker.io/hashicorp/vault:2.2.1@sha256:962a92876e168d68eaaa24b0b8b49bbce1cb63024060a67bba95cd158a366fc2
          # The binary itself, not the image's entrypoint, which would try
          # to give it IPC_LOCK; mlock is off (vault.hcl), as HashiCorp
          # advises with integrated storage.
          command: [vault, server, -config=/vault/config/vault.hcl]
          env:
            - {name: VAULT_ADDR, value: "https://127.0.0.1:8200"}
            - {name: VAULT_CACERT, value: /vault/tls/ca.crt}
            - {name: HOME, value: /tmp}
            # The Go runtime collects harder before the pod's limit, rather
            # than meet it: a Vault killed for memory comes back sealed.
            - {name: GOMEMLIMIT, value: 384MiB}
          ports:
            - {name: https, containerPort: 8200}
          # Ready only when initialised, unsealed and active: the Service
          # sends nothing to a sealed Vault. Alive while sealed, so a restart
          # waits for its unseal rather than looping.
          readinessProbe:
            httpGet: {path: /v1/sys/health, port: https, scheme: HTTPS}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: "/v1/sys/health?sealedcode=200&uninitcode=200", port: https, scheme: HTTPS}
            periodSeconds: 30
            failureThreshold: 4
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - {name: config, mountPath: /vault/config, readOnly: true}
            - {name: tls, mountPath: /vault/tls, readOnly: true}
            - {name: data, mountPath: /vault/data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap:
            name: vault-config
        # Made by scripts/vault.sh install from a CA made for this run.
        - name: tls
          secret:
            secretName: vault-tls
            defaultMode: 0440
        - name: tmp
          emptyDir: {sizeLimit: 16Mi}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 1Gi}
