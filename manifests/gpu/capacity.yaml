# scripts/capacity.py against one model server, from a pod beside it
# (measure.yaml). The script, the harness it takes the agent's calls from,
# the tasks, and the MCP server's tool table and policy come in one
# ConfigMap, laid out as in the repository. The result is printed after a
# marker line, for scripts/gpu.sh to read from the log. @SERVER@, @MODEL@,
# @SLOTS@, @THREADS@, @ACCELERATOR@ and @MIN_SECONDS@ are filled in there.
apiVersion: batch/v1
kind: Job
metadata:
  name: capacity
  namespace: measure
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: capacity
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: capacity
          image: docker.io/library/python:3.13-alpine@sha256:bf12ecc0bea3f171d55145dd02c78b5eeb09f30ee2ac9cc2b4c9e4e8f5e30741
          # Until the network policies reach the pod and the server answers,
          # then the levels.
          command:
            - sh
            - -c
            - |
              for i in $(seq 1 60); do wget -q -O /dev/null -T 2 "$SERVER/health" && break; sleep 2; done
              python3 /work/scripts/capacity.py run "$SERVER" /tmp/result.json 1,2,4,8 || exit 1
              echo '--capacity--'
              cat /tmp/result.json
          env:
            - {name: SERVER, value: "@SERVER@"}
            - {name: MODEL, value: "@MODEL@"}
            - {name: SLOTS, value: "@SLOTS@"}
            - {name: THREADS, value: "@THREADS@"}
            - {name: ACCELERATOR, value: "@ACCELERATOR@"}
            - {name: MIN_SECONDS, value: "@MIN_SECONDS@"}
            - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
          # A whole core, so the client is never what is throttled: eight
          # threads waiting on a GPU that answers in a tenth of a second.
          resources:
            requests: {cpu: 250m, memory: 64Mi}
            limits: {cpu: "1", memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: work, mountPath: /work, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: work
          configMap:
            name: capacity
            items:
              - {key: capacity.py, path: scripts/capacity.py}
              - {key: harness.py, path: evals/harness.py}
              - {key: tasks.json, path: evals/tasks.json}
              - {key: server.py, path: manifests/mcp/server.py}
              - {key: policy.json, path: manifests/mcp/policy.json}
        - name: tmp
          emptyDir: {sizeLimit: 16Mi}
