# NVIDIA's device plugin (ADR 19): it finds the node's GPU and offers it to
# the scheduler as nvidia.com/gpu. Only on the GPU node, which is tainted.
# Its own namespace, not kube-system, so carried-images holds its image to
# the digests the bundle carried. It reads the kubelet's device-plugin
# socket directory on the host, which the namespace's Pod Security level
# allows and the workloads' namespaces do not.
apiVersion: v1
kind: Namespace
metadata:
  name: gpu-system
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvidia-device-plugin
  namespace: gpu-system
spec:
  selector:
    matchLabels: {app: nvidia-device-plugin}
  updateStrategy: {type: RollingUpdate}
  template:
    metadata:
      labels: {app: nvidia-device-plugin}
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        boundary.heyvaldemar.com/accelerator: nvidia
      tolerations:
        - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
      containers:
        - name: nvidia-device-plugin
          image: nvcr.io/nvidia/k8s-device-plugin:v0.20.1@sha256:d279ecdb47b252c4cd96f4224650e9808c36012f6979570c9611ddbc5b0749a7
          env:
            - {name: FAIL_ON_INIT_ERROR, value: "false"}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: device-plugin, mountPath: /var/lib/kubelet/device-plugins}
      volumes:
        - name: device-plugin
          hostPath: {path: /var/lib/kubelet/device-plugins}
