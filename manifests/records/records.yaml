# Another team's service that wants a key (records_api.py). The MCP server
# holds the key and calls it for an agent that is granted the records tool;
# no agent can reach it, and none holds the key.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: records-api
  namespace: corp
  labels:
    app.kubernetes.io/name: records-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: records-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: records-api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: docker.io/library/python:3.13-alpine@sha256:bf12ecc0bea3f171d55145dd02c78b5eeb09f30ee2ac9cc2b4c9e4e8f5e30741
          command: [python3, /app/records_api.py]
          env:
            - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 200m, memory: 96Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - {name: app, mountPath: /app, readOnly: true}
            - {name: records-key, mountPath: /var/run/secrets/records, readOnly: true}
      volumes:
        - name: app
          configMap:
            name: records-api
        - name: records-key
          secret:
            secretName: records-api-key
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: records-api
  namespace: corp
spec:
  selector:
    app.kubernetes.io/name: records-api
  ports:
    - {name: http, port: 8080, targetPort: http}
