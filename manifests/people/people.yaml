# The people the agent works for (ADR 15). At a site they are the company's
# own users, signed in through its identity provider, and the agent receives
# the token of whoever is asking. Here a ServiceAccount in this namespace
# stands in for each, and the cluster's issuer for the identity provider: a
# token for the audience people.boundary.heyvaldemar.com says who the person
# is, and manifests/mcp/policy.json says what each may do through the agent.
# Nothing runs here. Only an administrator can mint these tokens
# (serviceaccounts/token in this namespace); scripts/evals.sh does, for the
# evals, as a front end would at sign-in.
apiVersion: v1
kind: Namespace
metadata:
  name: people
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
# The support team's lead: every customer, every tool the agent has, and
# the documents everyone and the account managers may read. The evals'
# original fifteen tasks are asked on her behalf.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: support-lead
  namespace: people
automountServiceAccountToken: false
---
# Account managers: their own customers' records, the report, email, and
# the documents everyone and the account managers may read.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dana
  namespace: people
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: omar
  namespace: people
automountServiceAccountToken: false
---
# First-line support: any customer's record, and the documents everyone may
# read.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sam
  namespace: people
automountServiceAccountToken: false
---
# Finance: the documents everyone and finance may read, and nothing else.
# The control for the documents the others may not read (ADR 21): they are
# in the index, and the person who may read them gets them.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fiona
  namespace: people
automountServiceAccountToken: false
