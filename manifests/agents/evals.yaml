# The agent, run through the evals: one Job, as the support-agent identity,
# with one token for the MCP server's audience, one for the model gateway's,
# and no Kubernetes API token. Beside them, the tokens of the people the tasks
# are asked for (ADR 15), which scripts/evals.sh mints as a front end would at
# sign-in: the harness plays that front end too. It reaches the MCP server and the model
# gateway, and nothing else (network-policies.yaml, and the gateway's own
# rule in manifests/gateway/gateway.yaml).
apiVersion: batch/v1
kind: Job
metadata:
  name: evals
  namespace: agents
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: evals
    spec:
      restartPolicy: Never
      serviceAccountName: support-agent
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: agent
          image: docker.io/library/python:3.13-alpine@sha256:2d9aefe2fef018a7eb2c13064c89c71929800fd2e5dccdbf52ea5da5bb8d929a
          command: [python3, /evals/harness.py]
          env:
            # The model through the gateway, by name: scripts/evals.sh fills in
            # the gateway's address and the model this run serves.
            - {name: MODEL_URL, value: "@MODEL_URL@"}
            - {name: MODEL_NAME, value: "@MODEL_NAME@"}
            - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
            - {name: ATTEMPTS, value: "3"}
            - {name: MODEL_THREADS, value: "2"}
            - {name: OFFER_PATTERNS, value: "@OFFER_PATTERNS@"}
            - {name: MAX_TOKENS, value: "@MAX_TOKENS@"}
            - {name: TEMPERATURE, value: "@TEMPERATURE@"}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: evals, mountPath: /evals, readOnly: true}
            - {name: mcp-token, mountPath: /var/run/secrets/mcp, readOnly: true}
            - {name: models-token, mountPath: /var/run/secrets/models, readOnly: true}
            - {name: people, mountPath: /var/run/secrets/people, readOnly: true}
      volumes:
        - name: evals
          configMap: {name: evals}
        - name: mcp-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: mcp.boundary.heyvaldemar.com
                  expirationSeconds: 3600
        - name: people
          secret: {secretName: people-tokens}
        - name: models-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: models.boundary.heyvaldemar.com
                  expirationSeconds: 3600
