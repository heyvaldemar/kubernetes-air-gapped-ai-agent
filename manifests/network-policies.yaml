# Two walls. The first is the sandbox's own: nothing leaves an agent pod but
# DNS and the MCP server, its one door to its tools. The second belongs to
# everyone else: corp refuses connections from any sandbox namespace, so
# opening the first wall by mistake does not open the second.
#
# The MCP server is walled the same way: it takes calls from sandboxes only,
# and reaches the two services its tools call, DNS and the API server (for
# TokenReview; that rule names the API server's address, so
# scripts/install-sandbox.sh writes it at install).
#
# NetworkPolicy works on addresses and ports, not on names. An agent cannot
# connect anywhere it is not allowed to, but it can still resolve names, and
# DNS itself can carry data out; docs/threat-model.md says so.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: agents
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: agents
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-mcp-server
  namespace: agents
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mcp
          podSelector:
            matchLabels:
              app.kubernetes.io/name: mcp-server
      ports:
        - {protocol: TCP, port: 8080}
---
# The report tool's upstream takes calls from the MCP server and nothing else:
# an agent reaches it only through a tool it is granted.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tool-gateway-from-mcp
  namespace: tools
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tool-gateway
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mcp
          podSelector:
            matchLabels:
              app.kubernetes.io/name: mcp-server
      ports:
        - {protocol: TCP, port: 9898}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: mcp
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-server
  namespace: mcp
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mcp-server
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              boundary.heyvaldemar.com/agents: "true"
      ports:
        - {protocol: TCP, port: 8080}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tools
          podSelector:
            matchLabels:
              app.kubernetes.io/name: tool-gateway
      ports:
        - {protocol: TCP, port: 9898}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: corp
          podSelector:
            matchLabels:
              app.kubernetes.io/name: records-api
      ports:
        - {protocol: TCP, port: 8080}
    # The embedding model, for the document search (ADR 21).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: inference
          podSelector:
            matchLabels:
              app: embed
      ports:
        - {protocol: TCP, port: 8080}
---
# The embedding model answers the MCP server alone, and starts nothing of its
# own. The agents do not reach it: what they may find in the documents is
# what the MCP server lets them search (ADR 21).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: embed-server
  namespace: inference
spec:
  podSelector:
    matchLabels:
      app: embed
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mcp
          podSelector:
            matchLabels:
              app.kubernetes.io/name: mcp-server
      ports:
        - {protocol: TCP, port: 8080}
---
# The second wall: every namespace may reach corp except a sandbox.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: refuse-sandboxes
  namespace: corp
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - {key: boundary.heyvaldemar.com/agents, operator: DoesNotExist}
---
# The agents reach the model server, and nothing else in inference.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-model
  namespace: agents
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: inference
          podSelector:
            matchLabels:
              app: llama
      ports:
        - {protocol: TCP, port: 8080}
---
# The model server answers the agents and starts nothing of its own: it has
# no egress at all.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: model-server
  namespace: inference
spec:
  podSelector:
    matchLabels:
      app: llama
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              boundary.heyvaldemar.com/agents: "true"
      ports:
        - {protocol: TCP, port: 8080}
