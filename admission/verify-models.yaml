# A pod in a namespace labelled boundary.heyvaldemar.com/models=verified may
# mount model weights only from the registry inside the boundary, by digest,
# signed with the operator's key. Verified with no network beyond the
# registry: the key is inline, and the transparency log is skipped because
# nothing inside the boundary can reach one. That is a weaker guarantee than
# keyless signing with a log, and this file says so where it does it.
#
# The model also carries an AI-BOM, a CycloneDX ML-BOM attested with the same
# key (scripts/mlbom.py, scripts/model.sh): what the model is, where its file
# came from, its sha256, and its licence, which must be on the site's list.
#
# Kyverno 1.19 extracts images from containers, init containers and
# ephemeral containers only; an image volume is not checked unless a policy
# asks: kyverno/kyverno#17555 would have added it, and was closed unmerged on
# 2026-10-22. The `images` entry below asks.
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: verify-models
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  webhookConfiguration:
    timeoutSeconds: 30
  evaluation:
    background:
      enabled: false
  autogen:
    podControllers:
      controllers: []
  matchConstraints:
    namespaceSelector:
      matchLabels:
        boundary.heyvaldemar.com/models: verified
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  images:
    - name: volumes
      expression: >-
        object.spec.?volumes.orValue([]).filter(v, has(v.image)).map(v, v.image.reference)
  matchImageReferences:
    - glob: "registry.boundary.internal:5000/models/*"
  validationConfigurations:
    verifyDigest: true
    mutateDigest: false
    required: true
  attestations:
    - name: mlbom
      intoto:
        type: https://cyclonedx.org/bom
  attestors:
    - name: operator
      cosign:
        key:
          data: |
            @OPERATOR_KEY@
        ctlog:
          insecureIgnoreTlog: true
          insecureIgnoreSCT: true
  validations:
    - expression: >-
        images.volumes.all(i, i.startsWith('registry.boundary.internal:5000/models/') && i.contains('@sha256:'))
      message: model weights come only from registry.boundary.internal:5000/models, by digest
    - expression: >-
        images.volumes.map(i, verifyImageSignatures(i, [attestors.operator])).all(n, n > 0)
      message: model weights are signed with the operator's key
    # The AI-BOM. Each expression verifies the attestation's signature before
    # it reads it: CEL's && makes a missing attestation false rather than an
    # error, and extractPayload() returns the in-toto statement, so the BOM
    # is under .predicate (Kyverno 1.19.1).
    - expression: >-
        images.volumes.map(i, verifyAttestationSignatures(i, attestations.mlbom, [attestors.operator])).all(n, n > 0)
      message: model weights carry an AI-BOM signed with the operator's key
    # The licence. An SPDX expression is not read here: "A OR B" offers a
    # choice and "A AND B" adds an obligation, and a rule that looked for an
    # allowed id inside one would admit "Apache-2.0 AND CC-BY-NC-4.0".
    # scripts/mlbom.py evaluates the expression where the BOM is made and
    # writes the licences it concluded as ids, so an expression here is
    # refused on purpose, and so is a component nested where the next rule
    # would not look.
    - expression: >-
        images.volumes.all(i, verifyAttestationSignatures(i, attestations.mlbom, [attestors.operator]) > 0 &&
          extractPayload(i, attestations.mlbom).predicate.?metadata.?component.?components.orValue([]).size() == 0 &&
          extractPayload(i, attestations.mlbom).predicate.?components.orValue([]).all(c, !has(c.components) &&
            c.?licenses.orValue([]).all(l, !has(l.expression))))
      message: the model's AI-BOM names each licence by its SPDX id, with no expression and no nested component (scripts/mlbom.py concludes an expression to ids)
    # Every model in the BOM, and at least one; every licence entry on each,
    # and at least one. CycloneDX does not say whether two entries mean both
    # apply or either may be chosen, and "every entry allowed" is the one
    # reading safe under both.
    - expression: >-
        images.volumes.all(i, verifyAttestationSignatures(i, attestations.mlbom, [attestors.operator]) > 0 &&
          extractPayload(i, attestations.mlbom).predicate.?components.orValue([]).exists(c, c.type == 'machine-learning-model') &&
          extractPayload(i, attestations.mlbom).predicate.components.all(c, c.type != 'machine-learning-model' ||
            (c.?licenses.orValue([]).size() > 0 &&
             c.licenses.all(l, has(l.license) && has(l.license.id) && l.license.id in ['Apache-2.0', 'MIT']))))
      message: every model in the AI-BOM declares only licences the site allows (Apache-2.0, MIT)
