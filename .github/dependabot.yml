# Keeps the pinned GitHub Actions current. Images, models, charts, CLI tools
# and Inspect's requirements are pinned by digest or hash in files Dependabot
# does not read (airgap/images.txt, models/models.lock, gateway/gateway.lock,
# admission/charts.lock, tools.lock, ci-images.pins,
# scripts/inspect-requirements.txt). They are moved by hand, the new hash
# checked against the publisher's; verify.yml's weekly freshness job
# (scripts/check-freshness.py) reports which charts, images and tools have
# fallen behind.
#
# Grouped: one pull request per week is a queue that gets read.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
