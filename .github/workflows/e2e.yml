name: Air-gapped e2e

# Builds the boundary and proves it: a kind cluster whose images come from a
# registry inside, with the runner's firewall, the node's DNS and CoreDNS
# closed, then checks that nothing gets out and that what is inside still
# comes up. See scripts/airgap.sh and tests/e2e/run.sh.

on:
  push:
    branches: [main]
  # Every day, so a boundary that stops holding, a model that stops
  # verifying or an eval that moves is seen within a day of upstream
  # changing under it.
  schedule:
    - cron: "29 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: The boundary holds (${{ matrix.model }}${{ matrix.patterns == 'off' && ', patterns hidden' || '' }})
    runs-on: ubuntu-latest
    timeout-minutes: 100
    # The same boundary around every model: what changes with the model is
    # the model's own numbers, and the boundary's stay at zero. The models a
    # release ships with also have to do most of their ordinary tasks; the
    # others are here to be measured (floor: off), and are held to the
    # boundary's gates like the rest.
    # Twice each: with the tools' full schemas, and with their patterns
    # hidden from the model (OFFER_PATTERNS=off) while the MCP server checks
    # the full schema as always. The model server builds a grammar from a
    # schema, and for some chat templates that grammar, not the model, is
    # what kept an outside address from being written (ADR 13): the second
    # job is the model's own behaviour.
    strategy:
      fail-fast: false
      matrix:
        model: [granite-4.0-1b, qwen3.5-2b, ministral-3-3b, granite-4.1-3b, qwen3-4b-2507, minicpm5-2b]
        patterns: ["on", "off"]
        include:
          - model: granite-4.0-1b
            patterns: "on"
            floor: "on"
          - model: qwen3.5-2b
            patterns: "on"
            floor: "on"
    env:
      MODEL: ${{ matrix.model }}
      TASK_FLOOR: ${{ matrix.floor || 'off' }}
      OFFER_PATTERNS: ${{ matrix.patterns }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The runner
        # Cost and latency per task move by up to about two times between runs
        # of the same code. The CPU a job ran on is the first thing to compare
        # before calling a difference anything else.
        run: |
          cpu="$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2- | sed 's/^ *//' || true)"
          [ -n "$cpu" ] || cpu="$(lscpu 2>/dev/null | sed -n 's/^Model name: *//p' | head -1)"
          echo "cpu: ${cpu:-unknown}, $(nproc) vCPU"

      - name: Room for a model
        # The model goes through a GGUF file, an OCI layout, the registry and
        # the node's containerd before a pod mounts it: a 1 GB file needs
        # several. The runner's preinstalled SDKs take most of the disk and
        # none of them is used here.
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h / | tail -1

      - name: Install the pinned tools
        run: ./scripts/install-tools.sh >> "$GITHUB_PATH"

      - name: Create the cluster
        run: kind create cluster --config kind/cluster.yaml --wait 120s

      - name: The registry inside, seeded, and the node pointed at it
        run: |
          ./scripts/airgap.sh registry
          ./scripts/airgap.sh seed
          ./scripts/airgap.sh mirror

      - name: The model, built reproducibly, signed, and two plants
        run: |
          ./scripts/model.sh build
          ./scripts/model.sh sign
          ./scripts/model.sh plants

      - name: The admission chart and the gateway, fetched and checked
        run: |
          ./scripts/admission.sh fetch
          ./scripts/gateway.sh fetch

      # Everything above is the vendor's side: a connected machine with a
      # staging registry. Everything the cluster runs leaves it as one
      # signed file, and the staging registry is replaced by an empty one
      # before the boundary closes, so nothing inside arrives any other way.
      - name: Everything the cluster runs, in one signed file
        run: ./scripts/bundle.sh create

      - name: An empty registry inside, then close the boundary
        run: |
          ./scripts/airgap.sh registry
          rm -rf .cache/airgap/charts
          ./scripts/airgap.sh mirror
          ./scripts/airgap.sh close

      - name: Across the gap, the bundle verified and loaded
        run: ./scripts/bundle.sh load

      - name: Kyverno and the model policies, from inside
        run: |
          ./scripts/admission.sh install
          ./scripts/admission.sh policy

      - name: The model server, serving the signed model
        run: ./scripts/serve.sh

      - name: The tool side, inside
        run: ./scripts/tools.sh

      # The agent reaches its model only through the gateway, as itself:
      # one route, to the one model server, and the agent's own quota.
      - name: The gateway, inside
        run: ./scripts/gateway.sh install

      - name: Prove the boundary and the model's way in
        env:
          E2E_RESULTS: ${{ runner.temp }}/e2e-results.json
        run: ./tests/e2e/run.sh

      - name: Run the agent through the evals
        env:
          E2E_RESULTS: ${{ runner.temp }}/e2e-results.json
          EVALS_RESULTS: ${{ runner.temp }}/evals-results.json
        run: ./scripts/evals.sh

      - name: What the cluster looked like
        if: failure()
        run: |
          kubectl get pods -A -o wide || true
          kubectl -n inference describe pod -l app=llama | tail -30 || true
          kubectl -n kyverno logs deploy/kyverno-admission-controller --tail=40 || true
          kubectl -n agents logs job/evals --tail=20 || true
          kubectl -n mcp logs deploy/mcp-server --tail=20 || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -30 || true
          node="$(kind get nodes --name air-gapped | head -1)"
          docker exec "$node" sh -c 'cat /etc/resolv.conf; ls /etc/containerd/certs.d; cat /etc/containerd/certs.d/docker.io/hosts.toml' || true
          sudo iptables -S DOCKER-USER || true
          docker logs kind-registry 2>&1 | tail -20 || true

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-results-${{ matrix.model }}${{ matrix.patterns == 'off' && '-patterns-off' || '' }}
          path: |
            ${{ runner.temp }}/e2e-results.json
            ${{ runner.temp }}/evals-results.json
            .cache/airgap/evals.jsonl
            .cache/airgap/mcp-audit.jsonl
          if-no-files-found: ignore

  gateway:
    # Two models behind one gateway, inside the same boundary: the request
    # names the model and the gateway routes it, a client over its limit is
    # refused while the next is served, and the model servers cannot be
    # reached around it (ADR 10). Everything arrives in the same signed
    # bundle as in the jobs above.
    name: Two models, one gateway
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Room for two models
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h / | tail -1

      - name: Install the pinned tools
        run: ./scripts/install-tools.sh >> "$GITHUB_PATH"

      - name: Create the cluster
        run: kind create cluster --config kind/cluster.yaml --wait 120s

      - name: The staging registry, seeded
        run: |
          ./scripts/airgap.sh registry
          ./scripts/airgap.sh seed
          ./scripts/airgap.sh mirror

      - name: Two models, built reproducibly and signed
        run: |
          for m in granite-4.0-1b minicpm5-2b; do
            MODEL="$m" ./scripts/model.sh build
            MODEL="$m" ./scripts/model.sh sign
          done

      - name: The admission chart and the gateway, fetched and checked
        run: |
          ./scripts/admission.sh fetch
          ./scripts/gateway.sh fetch

      - name: Everything the cluster runs, in one signed file
        run: ./scripts/bundle.sh create

      - name: An empty registry inside, then close the boundary
        run: |
          ./scripts/airgap.sh registry
          rm -rf .cache/airgap/charts
          ./scripts/airgap.sh mirror
          ./scripts/airgap.sh close

      - name: Across the gap, the bundle verified and loaded
        run: ./scripts/bundle.sh load

      - name: Kyverno and the model policies, from inside
        run: |
          ./scripts/admission.sh install
          ./scripts/admission.sh policy

      - name: Two model servers, each serving its signed model
        run: |
          MODEL=granite-4.0-1b SERVE_NAME=granite ./scripts/serve.sh
          MODEL=minicpm5-2b SERVE_NAME=minicpm ./scripts/serve.sh

      - name: The tool side, inside
        run: ./scripts/tools.sh

      - name: The gateway, inside
        env:
          SERVED: granite-4.0-1b=granite minicpm5-2b=minicpm
        run: ./scripts/gateway.sh install

      - name: Prove the gateway
        env:
          E2E_RESULTS: ${{ runner.temp }}/e2e-results.json
        run: ./tests/e2e/gateway.sh

      # Who the agent acts for (ADR 15): the MCP server as it runs, real
      # tokens, no model. Here because this job runs once a day.
      - name: Prove the agent acts for a person, with that person's rights
        env:
          E2E_RESULTS: ${{ runner.temp }}/e2e-results.json
        run: ./tests/e2e/people.sh

      - name: What the cluster looked like
        if: failure()
        run: |
          kubectl get pods -A -o wide || true
          kubectl -n gateway get gateway,httproute,agentgatewaypolicy -o yaml | tail -80 || true
          kubectl -n agentgateway-system logs deploy/agentgateway --tail=60 || true
          kubectl -n gateway logs deploy --tail=60 --all-containers || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -30 || true

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-results-gateway
          path: ${{ runner.temp }}/e2e-results.json
          if-no-files-found: ignore
