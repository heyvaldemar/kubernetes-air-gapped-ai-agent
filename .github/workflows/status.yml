name: Status

# Writes what the e2e workflow has shown lately (scripts/status.py) to the
# branch `status`, where the README's badges and the fleet read it: green
# days in the last 30, the streak, and the latest run's checks and
# measurements. After every e2e run on main, and daily in case one was
# missed. The branch holds one commit, replaced each time, so main's history
# stays the code's and nothing here starts the e2e run again.
on:
  workflow_run:
    workflows: ["Air-gapped e2e"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "31 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: status
  cancel-in-progress: false

jobs:
  status:
    name: Write the status branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Push the branch `status`.
      contents: write
      # Read the e2e runs and the results they uploaded.
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the e2e runs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          E2E_WORKFLOW: e2e.yml
        run: python3 scripts/status.py "$RUNNER_TEMP/status"

      - name: The latest run's evals, as Inspect logs
        # One Inspect log per model job (scripts/inspect-log.py), each read back
        # by Inspect's own reader, onto the branch beside the leaderboard. A run
        # that failed before its evals has none to translate.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # shellcheck disable=SC2016
          run_id="$(python3 -c 'import json, sys; l = json.load(open(sys.argv[1]))["latest"]; print(l["url"].rsplit("/", 1)[1] if l else "")' "$RUNNER_TEMP/status/status.json")"
          if [ -z "$run_id" ]; then echo "no finished run on main: no Inspect logs"; exit 0; fi
          read -r created commit < <(gh run view "$run_id" -R "$GITHUB_REPOSITORY" --json createdAt,headSha --jq '"\(.createdAt) \(.headSha)"')
          gh run download "$run_id" -R "$GITHUB_REPOSITORY" -p 'e2e-results-*' -D "$RUNNER_TEMP/run"
          python3 -m venv "$RUNNER_TEMP/inspect"
          "$RUNNER_TEMP/inspect/bin/pip" install -q --require-hashes --only-binary :all: -r scripts/inspect-requirements.txt
          RUN_ID="$run_id" RUN_CREATED="$created" RUN_COMMIT="$commit" \
            "$RUNNER_TEMP/inspect/bin/python" scripts/inspect-log.py "$RUNNER_TEMP/run" "$RUNNER_TEMP/status/inspect"

      - name: Carry the run history forward
        # The branch is one commit, so its history of runs lives in its files:
        # history/<run id>.json for every finished run on main, carried from
        # the branch as it was, any missing one filled in from its artifacts,
        # and history.md rebuilt from them (scripts/status-history.py).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          E2E_WORKFLOW: e2e.yml
          REPO: ${{ github.repository }}
        run: |
          mkdir -p "$RUNNER_TEMP/status/history"
          if git clone -q --depth 1 -b status "https://github.com/$REPO.git" "$RUNNER_TEMP/prev" 2>/dev/null \
             && [ -d "$RUNNER_TEMP/prev/history" ]; then
            cp "$RUNNER_TEMP/prev/history/"*.json "$RUNNER_TEMP/status/history/" 2>/dev/null || true
          fi
          python3 scripts/status-history.py "$RUNNER_TEMP/status"

      - name: Replace the branch `status`
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          cd "$RUNNER_TEMP/status"
          # shellcheck disable=SC2016
          printf '# status\n\nWritten by .github/workflows/status.yml from the e2e runs on main, every day. Not edited by hand.\n\n`inspect/` holds the latest run'"'"'s evals as Inspect logs, one per model: `inspect view --log-dir inspect`. `history.md` lists every run on main since 2026-10-20 and the runs before it whose artifacts GitHub still kept, one file each in `history/`.\n' > README.md
          git init -q -b status
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "status: $(date -u +%FT%TZ)"
          # The credential reaches git through its environment, not its
          # command line, which any process on the runner can read.
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            git push -q -f "https://github.com/$REPO.git" status
