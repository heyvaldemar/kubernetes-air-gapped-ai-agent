name: Capacity

# What one model server sustains on a runner's four vCPUs, measured with the
# agent's own requests (scripts/capacity.py), for the two shipped models under
# three ways of spending the same CPUs: one slot with four threads, two slots
# with two, four slots with one. Each at concurrency 1, 2, 4 and 8. It decides
# nothing by itself: the sizing in the README names a run of this workflow,
# and a change to the model server's slots or threads cites one.
#
# The model server runs on the runner, outside any cluster: what is measured
# is the server, which is what saturates first; the gateway's own cost is a
# hop on the same node. Weekly, so a new llama.cpp or a new pin shows up here
# before anyone sizes a node from an old number.

on:
  schedule:
    - cron: "23 6 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    name: ${{ matrix.model }}, ${{ matrix.slots }} slot(s) x ${{ matrix.threads }} thread(s)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        model: [granite-4.0-1b, qwen3.5-2b]
        slots: [1, 2, 4]
        include:
          - {slots: 1, threads: 4}
          - {slots: 2, threads: 2}
          - {slots: 4, threads: 1}
    env:
      MODEL: ${{ matrix.model }}
      SLOTS: ${{ matrix.slots }}
      THREADS: ${{ matrix.threads }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The model, by revision, checked against its hash
        run: |
          read -r _ url sha _ < <(grep -vE '^\s*(#|$)' models/models.lock | awk -v m="$MODEL" '$1 == m')
          curl -fL --retry 3 -o "$RUNNER_TEMP/model.gguf" "$url"
          echo "$sha  $RUNNER_TEMP/model.gguf" | sha256sum -c -

      - name: llama-server, the build the boundary runs
        # The same image and flags as manifests/inference/llama.yaml, but for
        # the slots and threads under test. The context is per slot, so it is
        # 8192 times the slots: llama-server divides -c between them.
        run: |
          image="$(grep -E '^ghcr.io/ggml-org/llama.cpp:' airgap/images.txt)"
          # The runner's CPU, in the log: one attempt of this job ran 30 times
          # slower than its rerun on another runner (run 39541814938).
          lscpu | grep -E 'Model name|^CPU\(s\)' || true
          echo "RUNNER_CPUS=$(nproc)" >>"$GITHUB_ENV"
          echo "CONTEXT=$((8192 * SLOTS))" >>"$GITHUB_ENV"
          docker run -d --name llm -p 8080:8080 -v "$RUNNER_TEMP:/models:ro" "$image" \
            -m /models/model.gguf --alias "$MODEL" --jinja -c "$((8192 * SLOTS))" -np "$SLOTS" -t "$THREADS" \
            --host 0.0.0.0 --port 8080
          for _ in $(seq 1 60); do
            curl -fs http://127.0.0.1:8080/health >/dev/null && exit 0
            sleep 5
          done
          docker logs llm | tail -40
          exit 1

      - name: The agent's first calls, at concurrency 1, 2, 4 and 8
        run: python3 scripts/capacity.py run http://127.0.0.1:8080 "capacity-$MODEL-$SLOTS-$THREADS.json" 1,2,4,8

      - name: Keep the numbers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: capacity-${{ matrix.model }}-${{ matrix.slots }}-${{ matrix.threads }}
          path: capacity-*.json
          retention-days: 90

  table:
    name: One table
    needs: measure
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: capacity-*
          path: capacity
      - name: Print it
        run: python3 scripts/capacity.py table capacity | tee -a "$GITHUB_STEP_SUMMARY"
