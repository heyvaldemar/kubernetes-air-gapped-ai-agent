name: A node lost while it serves

# The node-loss drill on kind (ADR 20): two workers, two of each service the
# boundary depends on, and tests/e2e/nodeloss.sh. Called by the daily e2e run,
# whose results the status page reads; by hand on main.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nodeloss:
    name: A node lost while it serves
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      MODEL: granite-4.0-1b
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned tools
        run: ./scripts/install-tools.sh >> "$GITHUB_PATH"

      - name: Create the cluster, two workers in two zones
        run: kind create cluster --config kind/ha.yaml --wait 180s

      - name: The staging registry, seeded
        run: |
          ./scripts/airgap.sh registry
          ./scripts/airgap.sh seed
          ./scripts/airgap.sh mirror

      - name: The model, built reproducibly and signed, and the plants
        run: |
          ./scripts/model.sh build
          ./scripts/model.sh sign
          MODEL=nomic-embed-text-v1.5 ./scripts/model.sh build
          MODEL=nomic-embed-text-v1.5 ./scripts/model.sh sign
          ./scripts/model.sh plants

      - name: The admission chart and the gateway, fetched and checked
        run: |
          ./scripts/admission.sh fetch
          ./scripts/gateway.sh fetch

      - name: Everything the cluster runs, in one signed file
        run: ./scripts/bundle.sh create

      - name: An empty registry inside, then close the boundary
        run: |
          ./scripts/airgap.sh registry
          rm -rf .cache/airgap/charts
          ./scripts/airgap.sh mirror
          ./scripts/airgap.sh close

      - name: Across the gap, the bundle verified and loaded
        run: ./scripts/bundle.sh load

      # Two of each the drill watches, one on each worker.
      - name: Kyverno and the model policies, two admission controllers
        env:
          ADMISSION_REPLICAS: "2"
        run: |
          ./scripts/admission.sh install
          ./scripts/admission.sh policy

      - name: Two model servers, the signed model
        env:
          SERVE_REPLICAS: "2"
        run: ./scripts/serve.sh

      - name: The tool side, inside
        run: ./scripts/tools.sh

      - name: The gateway, two proxies
        env:
          GATEWAY_REPLICAS: "2"
        run: ./scripts/gateway.sh install

      - name: Disruption budgets
        run: |
          kubectl apply -f manifests/ha/disruption-budgets.yaml
          kubectl get pods -A -o wide | grep -E 'inference|gateway|kyverno' || true

      - name: A worker lost, brought back, and drained, while it serves
        env:
          E2E_RESULTS: ${{ runner.temp }}/e2e-results.json
        run: ./tests/e2e/nodeloss.sh

      - name: Diagnose kube-proxy on the node that came back
        if: always()
        run: |
          uname -r; docker version --format '{{.Server.Version}}' || true
          kubectl -n kube-system get pods -o wide || true
          for p in $(kubectl -n kube-system get pods -l k8s-app=kube-proxy -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.spec.nodeName}{"\n"}{end}' | awk '$2=="air-gapped-worker2"{print $1}'); do
            echo "== $p previous"; kubectl -n kube-system logs "$p" --previous --tail=80 || true
            echo "== $p now"; kubectl -n kube-system logs "$p" --tail=40 || true
            kubectl -n kube-system get pod "$p" -o jsonpath='{.status.containerStatuses[0].lastState}{"\n"}' || true
          done
          for n in air-gapped-worker air-gapped-worker2; do
            echo "== $n"
            docker exec "$n" sh -c 'iptables -V; ls -l /etc/alternatives/iptables /usr/sbin/iptables; cat /proc/net/ip_tables_names 2>&1; echo legacy nat:; iptables-legacy -t nat -S 2>&1 | wc -l; echo nft nat:; iptables-nft -t nat -S 2>&1 | wc -l; iptables-legacy -t nat -S 2>&1 | head -20' || true
            docker exec "$n" journalctl -u boundary-close --no-pager -o short-monotonic | tail -20 || true
            docker exec "$n" sh -c 'journalctl -u kubelet --no-pager | grep -iE "kube-proxy|iptables|nft" | tail -20' || true
          done

      - name: What the cluster looked like
        if: failure()
        run: |
          kubectl get nodes -o wide || true
          kubectl get pods -A -o wide || true
          kubectl get pdb -A || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -40 || true
          kubectl -n gateway logs -l gateway.networking.k8s.io/gateway-name=models --tail=40 --all-containers || true

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results-nodeloss
          path: ${{ runner.temp }}/e2e-results.json
          if-no-files-found: ignore
