name: Cloud results

# ADR 25. Each run on AWS, GKE and AKS uploads what it checked, and GitHub
# keeps an artifact for 90 days. After that, nobody outside can ask whether a
# file is the one a run uploaded. This workflow reads a finished cloud run's
# own record and results, checks the results against the digest GitHub
# reports, signs them as this workflow on main, and adds them to the branch
# `cloud-results`, which only grows.
#
# It starts no cloud run and holds no cloud credential: no environment, no
# stored secret, no login to AWS, Google Cloud or Azure. It reads this
# repository's own runs with its own token. The artifact is data: it is
# hashed, never unpacked, and nothing in it is run.
#
# After every run of the three cloud workflows on main, whatever its
# conclusion: a run that failed is kept too, so a week that went wrong is on
# the record. By hand, for one finished run that already happened, by its id.
# scripts/cloud-results.py decides again, from GitHub's own record of the
# run, whether it is one whose results are kept: this repository's, from its
# own code, one of the three workflows, on main, started by the schedule or
# by hand, finished.
on:
  workflow_run:
    workflows: ["The boundary on AWS", "The boundary on GKE", "The boundary on AKS"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run:
        description: "The id of a finished run of aws.yml, gke.yml or aks.yml on main, to keep its results. It starts no cloud run and costs nothing."
        required: true
        type: string

permissions:
  contents: read

# One at a time: three clouds can finish in the same hour, and each adds to
# the same branch.
concurrency:
  group: cloud-results
  cancel-in-progress: false

jobs:
  sign:
    name: Read the run's results, check them, sign them
    # On main only, where the signature's identity is this workflow at
    # refs/heads/main. A run that reached here through workflow_run is held
    # to main, to this repository's own code, and to the schedule or a
    # dispatch by hand; the script holds every run to the same, by its id.
    if: >-
      github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # The run's record, its jobs and its artifact.
      actions: read
      # cosign's keyless signature: the certificate names this workflow.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Written outside the checkout: nothing a run uploaded sits beside code.
      - name: The run's record and its results, checked against GitHub's digest
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN: ${{ github.event.workflow_run.id || inputs.run }}
        run: python3 scripts/cloud-results.py record "$RUN" "$RUNNER_TEMP/kept"

      - name: Sign the record, keyless, and verify the signature
        run: |
          set -euo pipefail
          record="$(find "$RUNNER_TEMP/kept" -name record.json)"
          [ "$(wc -l <<<"$record")" = 1 ] && [ -n "$record" ] || { echo "::error::expected one record, found: $record"; exit 1; }
          cosign sign-blob --yes "$record" --bundle "$record.sigstore.json"
          cosign verify-blob "$record" --bundle "$record.sigstore.json" \
            --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/cloud-results.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          cat "$record" >> "$GITHUB_STEP_SUMMARY"

      - name: Hand them to the job that writes the branch
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cloud-results
          path: ${{ runner.temp }}/kept
          if-no-files-found: error
          retention-days: 7

  keep:
    name: Add them to the branch `cloud-results`
    needs: sign
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Push the branch `cloud-results`.
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the signed record and the results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cloud-results
          path: ${{ runner.temp }}/kept

      # The branch has no parent in main and holds results only. A record
      # already there is never replaced; when another run of this workflow
      # pushed first, the branch is read again and the record added to that.
      - name: Add the record, and push
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The credential reaches git through its environment, not its
          # command line, which any process on the runner can read.
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          url="https://github.com/$REPO.git"
          for try in 1 2 3 4 5; do
            rm -rf "$RUNNER_TEMP/branch"
            if git ls-remote --exit-code --heads "$url" cloud-results >/dev/null; then
              git clone -q --depth 1 -b cloud-results "$url" "$RUNNER_TEMP/branch"
            else
              git init -q -b cloud-results "$RUNNER_TEMP/branch"
            fi
            GITHUB_REPOSITORY="$REPO" python3 scripts/cloud-results.py add "$RUNNER_TEMP/kept" "$RUNNER_TEMP/branch"
            git -C "$RUNNER_TEMP/branch" add -A
            if git -C "$RUNNER_TEMP/branch" diff --cached --quiet; then echo "nothing new to keep"; exit 0; fi
            git -C "$RUNNER_TEMP/branch" -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "cloud-results: $(cd "$RUNNER_TEMP/kept" && find . -name record.json | cut -d/ -f2-3 | tr '\n' ' ')"
            if git -C "$RUNNER_TEMP/branch" push -q "$url" cloud-results; then echo "kept, on try $try"; exit 0; fi
            echo "the branch moved while this was added; reading it again"
            sleep $((try * 5))
          done
          echo "::error::the branch cloud-results could not be pushed in five tries"
          exit 1
