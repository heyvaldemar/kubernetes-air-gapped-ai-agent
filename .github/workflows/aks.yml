name: The boundary on AKS

# ADR 23. The boundary this repository proves on kind, on AWS (ADR 18) and on
# Google Cloud (ADR 22), made on Azure and tried from inside: a network
# isolated AKS cluster, whose outbound type is none and whose own images come
# from a registry inside the network, not from mcr.microsoft.com; a network
# with no way out and a security group that denies egress again; a DNS
# resolver policy that refuses every name but the registry's and the
# network's own; and an API that answers the runner's own address only.
# tests/e2e/aks.sh tries the ways out, each beside a control.
#
# Phase 2, the agent on it, as on AWS and GKE: the model built, signed and
# given its AI-BOM on the connected side, everything the cluster runs carried
# in one signed file into the run's registry, Kyverno reading signatures
# there as the kubelet's identity, the one a pod can get with no way out
# (ADR 23), the model server, the MCP server and the gateway, then the checks
# the kind e2e runs on what is inside, the evals, Vault and the game day.
# AGENT says whether a run does it: by hand unless the dispatch says false,
# and on the schedule once the repository variable AZURE_AGENT_ENABLED is
# true.
#
# In the subscription the maintainer set up: an Entra application federated
# to this repository's main branch, in the environment azure-validation, by
# the repository's immutable subject; GitHub's OIDC token is exchanged for
# it, Contributor on a subscription that holds nothing but these runs. No
# stored credential, and no secret exists to store. He approved it on
# 2026-10-28, with a monthly budget of 10 (Canadian dollars, the account's
# currency), weekly on 2026-10-30, and on 2026-11-13 a ceiling of 20 a month
# for the whole subscription: a run that Cost Management says would pass it
# applies nothing (scripts/aks.sh guard).
#
# Weekly on a schedule, and by hand on main when the dispatch says SPEND. The
# schedule does nothing until the repository variable AZURE_VALIDATION_ENABLED
# is true. Everything a run makes is in one resource group, airgap-<run>; the
# teardown job deletes it whatever happened, the next run deletes any an
# earlier one left, and aks-sweep.yml deletes daily whatever a finished run
# left.
#
# On any other branch, a push that changes the run's files runs one job: it
# asks Entra for each of the two identities' tokens from that branch, and
# passes only when the federation refuses both.
on:
  schedule:
    # Tuesday: EKS's platform runs on Wednesday, AWS on Thursday and GKE on
    # Friday.
    - cron: "37 3 * * 2"
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type SPEND to create billed Azure resources (the boundary alone about $0.07 at list prices, CA$0.04 in Cost Management; with the agent about $0.35)"
        required: true
        type: string
      agent:
        description: "true runs the agent on the boundary (phase 2); false, the boundary alone"
        required: false
        type: choice
        options: ["true", "false"]
        default: "true"
      local_dns:
        description: "true only to show the resolver check its violation: AKS's LocalDNS turned on (ADR 23)"
        required: false
        type: choice
        options: ["false", "true"]
        default: "false"
      dns_firewall:
        description: "false only to show the DNS check its violation (ADR 23)"
        required: false
        type: choice
        options: ["true", "false"]
        default: "true"
      keep:
        description: "true leaves everything the run made, for aks-sweep.yml to find and delete (shows the sweep its violation); never on the schedule"
        required: false
        type: choice
        options: ["false", "true"]
        default: "false"
  push:
    branches-ignore: [main]
    paths:
      - .github/workflows/aks.yml
      - aks/**

permissions:
  contents: read

# The runs on main share the subscription one at a time; a branch's refusal
# job never waits for them, and never cancels one that waits.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'aks-boundary' || format('aks-refused-{0}', github.ref) }}
  cancel-in-progress: false

# bash -eo pipefail: a step whose pipe fails part way fails.
defaults:
  run:
    shell: bash

env:
  RUN_ID: ${{ github.run_id }}
  CLUSTER: airgap-${{ github.run_id }}
  TF_IN_AUTOMATION: "1"
  TERRAFORM_VERSION: 1.16.5
  AZURE_REGION: ${{ vars.AZURE_REGION }}
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  AZURE_STATE_ACCOUNT: ${{ vars.AZURE_STATE_ACCOUNT }}
  # Terraform, its state backend included, asks GitHub for the OIDC token
  # itself and exchanges it as the creation identity.
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ vars.AZURE_CREATE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  AGENT: ${{ (github.event_name == 'workflow_dispatch' && inputs.agent != 'false') || (github.event_name == 'schedule' && vars.AZURE_AGENT_ENABLED == 'true') }}
  # The boundary alone, two vCPUs; with the agent, four vCPUs and 16 GiB, the
  # node GKE's run has.
  NODE_SIZE: ${{ ((github.event_name == 'workflow_dispatch' && inputs.agent != 'false') || (github.event_name == 'schedule' && vars.AZURE_AGENT_ENABLED == 'true')) && 'Standard_D4as_v7' || 'Standard_D2as_v7' }}
  # The model a release ships with, held to the same gates as in the kind e2e.
  MODEL: granite-4.0-1b
  TASK_FLOOR: "on"
  OFFER_PATTERNS: "on"

jobs:
  refused:
    name: A branch gets no credential
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      # GitHub's token for this job, with the audience Entra expects, handed
      # to Entra as each identity's own login would hand it. The token is
      # read and sent inside the process, never in an argument or a log;
      # what is printed is its subject, and Entra's error code and message.
      - name: Ask for each identity's token from this branch
        env:
          TENANT: ${{ vars.AZURE_TENANT_ID }}
          CREATE: ${{ vars.AZURE_CREATE_CLIENT_ID }}
          SWEEP: ${{ vars.AZURE_SWEEP_CLIENT_ID }}
        run: |
          python3 - <<'PY'
          import base64, json, os, sys, urllib.error, urllib.parse, urllib.request
          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=" + urllib.parse.quote("api://AzureADTokenExchange", safe="")
          req = urllib.request.Request(url, headers={"Authorization": "bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]})
          token = json.load(urllib.request.urlopen(req))["value"]
          claims = json.loads(base64.urlsafe_b64decode(token.split(".")[1] + "=="))
          print("asking as", claims["sub"])
          bad = 0
          for name in ("CREATE", "SWEEP"):
              body = urllib.parse.urlencode({
                  "client_id": os.environ[name],
                  "scope": "https://management.azure.com/.default",
                  "grant_type": "client_credentials",
                  "client_assertion_type": "urn:ietf:params:oauth:client-assertion-type:jwt-bearer",
                  "client_assertion": token,
              }).encode()
              try:
                  urllib.request.urlopen(urllib.request.Request(
                      "https://login.microsoftonline.com/%s/oauth2/v2.0/token" % os.environ["TENANT"], data=body))
              except urllib.error.HTTPError as e:
                  said = json.load(e)
                  codes = said.get("error_codes", [])
                  print("%s identity: Entra answered HTTP %d, %s: %s" % (name.lower(), e.code, codes, said.get("error_description", "").split("\r\n")[0][:300]))
                  # AADSTS700213: no federated credential matches the subject.
                  if 700213 in codes:
                      print("refused by the federation: no credential of it names this branch's subject")
                      continue
                  print("refused, but not by the federation: this says nothing about it")
                  bad = 1
                  continue
              print("%s identity: a branch got a token: the federation admits more than main" % name.lower())
              bad = 1
          sys.exit(bad)
          PY

  up:
    name: Apply, load, check
    if: github.ref == 'refs/heads/main' && (inputs.confirm == 'SPEND' || (github.event_name == 'schedule' && vars.AZURE_VALIDATION_ENABLED == 'true'))
    runs-on: ubuntu-latest
    # The federation names this environment in the subject it admits.
    environment: azure-validation
    timeout-minutes: 130
    permissions:
      contents: read
      # The OIDC token the federation exchanges, for this environment on main.
      id-token: write
    outputs:
      started: ${{ steps.start.outputs.at }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned tools
        run: ./scripts/install-tools.sh >> "$GITHUB_PATH"

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: The creation identity, through the federation
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CREATE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Before anything is billed: the budgets are there, and this month, as
      # Cost Management counts the whole subscription, leaves room for this
      # run under the 20 a month the maintainer allowed. A budget only alerts.
      - name: The budget, and room in the month for this run
        run: ./scripts/aks.sh guard

      - name: What an earlier run left, deleted first
        run: ./scripts/aks.sh sweep

      - name: The region's vCPU quota holds the node
        run: ./scripts/aks.sh quota

      # The vendor's side, before anything is billed, as on AWS and GKE: a
      # staging registry on the runner, the model built reproducibly, signed
      # and attested, the plants, the charts, and all of it in one signed
      # file. The staging registry is gone before the file crosses.
      - name: Everything the cluster runs, in one signed file
        if: env.AGENT == 'true'
        run: |
          df -h / | tail -1
          NETWORK=bridge ./scripts/airgap.sh registry
          GPU=0 ./scripts/airgap.sh seed
          ./scripts/model.sh build
          ./scripts/model.sh sign
          # The document search's embedding model (ADR 21).
          MODEL=nomic-embed-text-v1.5 ./scripts/model.sh build
          MODEL=nomic-embed-text-v1.5 ./scripts/model.sh sign
          ./scripts/model.sh plants
          ./scripts/admission.sh fetch
          ./scripts/gateway.sh fetch
          ./scripts/bundle.sh create
          ./scripts/airgap.sh open
          df -h / | tail -1

      # The bundle takes twenty minutes, and az's next token, the state
      # account's, is asked for after it.
      - name: The creation identity again, after the bundle
        if: env.AGENT == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CREATE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # The run's variables go to the state account beside its state, for
      # the record of what this job applied.
      - name: The run's variables
        env:
          DNS_FIREWALL: ${{ inputs.dns_firewall != 'false' }}
          LOCAL_DNS: ${{ inputs.local_dns == 'true' }}
        run: |
          ip="$(curl -fsS https://checkip.amazonaws.com | tr -d '\n')"
          python3 - "$ip" > run.tfvars.json <<'PY'
          import json, os, sys
          print(json.dumps({
              "location": os.environ["AZURE_REGION"],
              "run_id": os.environ["RUN_ID"],
              "cluster_name": os.environ["CLUSTER"],
              "operator_cidrs": [sys.argv[1] + "/32"],
              "node_vm_size": os.environ["NODE_SIZE"],
              "dns_firewall": os.environ["DNS_FIREWALL"] == "true",
              "local_dns": os.environ["LOCAL_DNS"] == "true",
          }, indent=1))
          PY
          az storage blob upload --auth-mode login --account-name "$AZURE_STATE_ACCOUNT" --container-name airgap-runs \
            --name "$RUN_ID/run.tfvars.json" --file run.tfvars.json --overwrite -o none
          echo "agent: $AGENT, dns_firewall: $DNS_FIREWALL, local_dns: $LOCAL_DNS, node: $NODE_SIZE"

      - name: Terraform init, one state per run
        run: |
          printf 'terraform {\n  backend "azurerm" {}\n}\n' > aks/ci_backend.tf
          terraform -chdir=aks init -input=false -lockfile=readonly \
            -backend-config="storage_account_name=$AZURE_STATE_ACCOUNT" -backend-config="container_name=airgap-runs" \
            -backend-config="key=$RUN_ID/terraform.tfstate" -backend-config="use_azuread_auth=true"

      # From here the run is billed: the cost table counts from this clock.
      - name: Start the clock
        id: start
        run: echo "at=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Apply
        run: terraform -chdir=aks apply -input=false -auto-approve -var-file="$PWD/run.tfvars.json"

      # az exchanges GitHub's token for each new token it needs, and GitHub's
      # token does not outlive the apply: the registry's login 10 minutes
      # after the first came back empty (run 41003911049). Terraform asks
      # GitHub for its own each time.
      - name: The creation identity again, after the apply
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CREATE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # With the agent, the file that crossed is checked and loaded into the
      # run's registry, which holds nothing of it until then; without it,
      # busybox alone, by digest.
      - name: Across the gap, into the registry inside
        run: |
          for o in registry registry_name inside registry_cidr kubelet_client_id; do
            echo "$(tr '[:lower:]' '[:upper:]' <<<"$o")=$(terraform -chdir=aks output -raw "$o")" >> "$GITHUB_ENV"
          done
          REGISTRY="$(terraform -chdir=aks output -raw registry)"; export REGISTRY
          REGISTRY_NAME="$(terraform -chdir=aks output -raw registry_name)"; export REGISTRY_NAME
          INSIDE="$(terraform -chdir=aks output -raw inside)"; export INSIDE
          if [ "$AGENT" = true ]; then
            ./scripts/aks.sh login
            ./scripts/bundle.sh load
          else
            ./scripts/aks.sh images
          fi

      - name: The cluster, from the operator's address
        run: |
          az aks get-credentials --resource-group "$CLUSTER" --name "$CLUSTER" --overwrite-existing --only-show-errors
          kubectl wait nodes --all --for=condition=Ready --timeout=600s
          kubectl -n kube-system rollout status deployment/coredns --timeout=300s
          kubectl get nodes -L node.kubernetes.io/instance-type,topology.kubernetes.io/zone -o wide
          # What AKS itself runs, and from where: every image of it named
          # mcr.microsoft.com, which the node's container runtime asks the
          # registry inside for instead.
          kubectl get pods -A -o custom-columns='NAMESPACE:.metadata.namespace,NAME:.metadata.name,IMAGES:.spec.containers[*].image'

      # Kyverno reads signatures from the registry as the kubelet's identity,
      # through the instance metadata service: a pod's own Entra identity
      # (workload identity) asks login.microsoftonline.com, which is outside.
      # The agent's namespaces cannot reach the metadata service; the
      # boundary's checks below try it (ADR 23).
      - name: Kyverno and the model policies, from the registry inside
        if: env.AGENT == 'true'
        env:
          REGISTRY_CREDENTIALS: azure
        run: |
          KYVERNO_VALUES="$(./scripts/aks.sh kyverno)" ./scripts/admission.sh install
          ./scripts/admission.sh policy

      - name: The model server, the tool side and the gateway, from the registry inside
        if: env.AGENT == 'true'
        run: |
          ./scripts/serve.sh
          ./scripts/tools.sh
          ./scripts/gateway.sh install

      - name: What is inside, and that nothing else runs
        if: env.AGENT == 'true'
        env:
          E2E_RESULTS: ${{ runner.temp }}/e2e-results.json
          CHECKS: inside
        run: ./tests/e2e/run.sh

      # The checks below read the registry with az, which needs a token from
      # a login younger than GitHub's.
      - name: The creation identity again, for the registry
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CREATE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: The boundary, tried from inside
        env:
          E2E_RESULTS: ${{ runner.temp }}/e2e-results.json
        run: ./tests/e2e/aks.sh

      - name: Run the agent through the evals
        if: env.AGENT == 'true'
        env:
          E2E_RESULTS: ${{ runner.temp }}/e2e-results.json
          EVALS_RESULTS: ${{ runner.temp }}/evals-results.json
        run: ./scripts/evals.sh

      # The records credential from Vault (ADR 24), as on kind: who may get
      # one, what the records service refuses, and three cut-offs. Its volume
      # is an Azure disk in AKS's node group, which goes with the cluster.
      - name: The records credential from Vault, and its revocation
        if: env.AGENT == 'true'
        env:
          E2E_RESULTS: ${{ runner.temp }}/e2e-results.json
        run: ./tests/e2e/vault.sh

      # It takes parts of the cluster down and puts them back.
      - name: Game day, parts of the boundary taken down while it serves
        if: env.AGENT == 'true'
        env:
          E2E_RESULTS: ${{ runner.temp }}/e2e-results.json
          SERVED_DEPLOYMENT: llama
          SERVED_MODEL: ${{ env.MODEL }}
        run: ./tests/e2e/gameday.sh

      - name: What the cluster looked like
        if: failure()
        run: |
          az aks show --resource-group "$CLUSTER" --name "$CLUSTER" --query '{state:provisioningState, power:powerState.code, version:currentKubernetesVersion, network:networkProfile, bootstrap:bootstrapProfile}' -o json || true
          kubectl get nodes -o wide || true
          kubectl get pods -A -o wide || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -40 || true
          kubectl -n kyverno logs deploy/kyverno-admission-controller --tail=60 || true
          kubectl -n inference describe pod -l app=llama | tail -30 || true
          kubectl -n agents logs job/evals --tail=20 || true
          kubectl -n mcp logs deploy/mcp-server --tail=20 || true
          kubectl -n agentgateway-system logs deploy/agentgateway --tail=40 || true

      - name: Keep the checks
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results-aks
          path: |
            ${{ runner.temp }}/e2e-results.json
            ${{ runner.temp }}/evals-results.json
            .cache/airgap/evals.jsonl
            .cache/airgap/mcp-audit.jsonl
          if-no-files-found: ignore
          retention-days: 90

  down:
    name: Delete, look for residue, report the cost
    needs: up
    # Whatever happened to the run, unless it never started for real.
    if: always() && github.ref == 'refs/heads/main' && (inputs.confirm == 'SPEND' || (github.event_name == 'schedule' && vars.AZURE_VALIDATION_ENABLED == 'true'))
    runs-on: ubuntu-latest
    environment: azure-validation
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The creation identity, through the federation
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CREATE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # One delete: the run's resource group holds everything it made, and
      # AKS deletes the node's group with the cluster.
      - name: Delete the run's resource group
        if: inputs.keep != 'true'
        run: ./scripts/aks.sh delete

      # The same after the delete, which takes ten minutes: the state
      # account's token is asked for only after it (AADSTS700024, run
      # 41001631612).
      - name: The creation identity again, for the state account
        if: inputs.keep != 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CREATE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Nothing left behind
        if: inputs.keep != 'true'
        run: ./scripts/aks.sh residue

      - name: Left for the sweep
        if: inputs.keep == 'true'
        run: echo "keep is true, so everything $CLUSTER made is left for aks-sweep.yml, which must find and delete it"

      - name: What the run cost
        if: always() && needs.up.outputs.started != ''
        env:
          STARTED: ${{ needs.up.outputs.started }}
        run: ./scripts/aks.sh cost | tee -a "$GITHUB_STEP_SUMMARY" || true
