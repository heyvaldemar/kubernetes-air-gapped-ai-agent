name: Verify

# The checks that need no cluster: workflows and shell scripts linted, every
# manifest valid for Kubernetes 1.37, every image by digest, the agent
# compiles, the MCP server's grants and protocol, and each of those checks
# shown the violation it exists for, in four jobs side by side whose
# records a fifth holds to tests/static/plants.tsv. Then the official MCP
# Python SDK, pinned by hash, drives the MCP server as a client.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "37 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Static checks
    runs-on: ubuntu-latest
    # A minute and a half at a678753 (run 43629124506), 63 s of it the
    # checks. The plants ran here after them until then: 18 min 4 s for 206
    # in a job allowed 25. They have the jobs below.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the pinned CI images
        run: grep -E '^[A-Z_]+=' ci-images.pins >> "$GITHUB_ENV"

      - name: actionlint
        run: docker run --rm -v "$PWD:/mnt" -w /mnt "$ACTIONLINT_IMAGE" -color

      - name: shellcheck
        run: docker run --rm -v "$PWD:/mnt" -w /mnt "$SHELLCHECK_IMAGE" -x scripts/*.sh tests/e2e/*.sh tests/static/*.sh

      - name: Install the pinned tools
        run: ./scripts/install-tools.sh >> "$GITHUB_PATH"

      # For static check "aws": aws/'s tests run against a mocked provider.
      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false

      - name: Static checks
        run: ./scripts/validate.sh

  # Every row of tests/static/plants.tsv, a quarter to a job: the rows whose
  # place in the file leaves the shard's remainder, so each check's plants
  # are spread over the four (tests/static/plant_violations.py).
  plants:
    name: Each check, shown its planted violation (${{ matrix.shard }} of 4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned tools
        run: ./scripts/install-tools.sh >> "$GITHUB_PATH"

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false

      # Each plant is a copy of this tree with one thing broken. The copy
      # takes what the checks leave here, the schemas under .cache/ and
      # Terraform's providers, and downloads nothing again.
      - name: The untouched tree passes every check
        run: ./scripts/validate.sh

      - name: This shard's plants
        env:
          SHARD: ${{ matrix.shard }}
        run: python3 tests/static/plant_violations.py --shard "$SHARD/4" --result "$RUNNER_TEMP/plants-$SHARD.json"

      - name: Keep what this shard showed, for the total
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plants-${{ matrix.shard }}
          path: ${{ runner.temp }}/plants-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 7

  # A shard that showed nothing ends green. This job reads what each one
  # wrote down and holds it to the file in its own checkout: every shard
  # there once, every row shown by the shard it belongs to, and as many
  # caught as the file has rows.
  plants-total:
    name: Every plant shown once, and caught
    needs: plants
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: What each shard showed
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: plants-*
          path: ${{ runner.temp }}/plants

      - name: The total, shown the records it must refuse
        run: python3 tests/static/plant_violations.py --prove-total

      - name: As many caught as plants.tsv has rows
        run: python3 tests/static/plant_violations.py --total "$RUNNER_TEMP/plants"

  freshness:
    name: Pins that fell behind upstream
    # Scheduled and manual only: a new upstream release is not actionable in
    # an unrelated pull request. A failure lands as a workflow-failure
    # notification, which fleet triage reads. Dependabot here watches the
    # workflows' actions and nothing else; this watches the charts, images,
    # tools and runtimes the platform pins (scripts/check-freshness.py).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare every pin with what upstream has released
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check-freshness.py
